#
# Continuous integration for Knap.
#
# Three facts about the Mojo 1.0.0 toolchain shape this file, and all three
# were verified by running the compiler rather than assumed:
#
#   1. "mojo format" has no check mode. It rewrites in place, so the format
#      gate formats and then asserts the working tree is unchanged.
#   2. "--Werror" and "--warn-on-unstable-apis" cannot be combined. Together
#      the build fails, because essentially the whole standard library is
#      unstable. They therefore run as separate jobs, one gating and one
#      reporting.
#   3. "mojo test" does not exist. A test file is a program whose main drives
#      a TestSuite, so tests are run with "mojo run".

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned exactly. Mojo guarantees source level stability only, and its ABI
  # is explicitly not stable.
  MOJO_VERSION: "1.0.0"

jobs:
  standards:
    name: Repository standards
    runs-on: ubuntu-24.04
    steps:
      # Full history. check_recipe.py resolves the commit the conda recipe
      # names, and the default shallow checkout does not contain it, so the
      # gate would report a valid revision as missing.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # These four gates need only the Python standard library and git, so
      # they run without the Mojo toolchain and fail fast.
      - name: Character and prose rules
        run: python scripts/lint_style.py

      - name: Source file banners
        run: python scripts/check_file_banners.py

      - name: Markdown structure
        run: python scripts/check_md_headers.py

      - name: SPDX identifiers
        run: python scripts/check_spdx.py

      # Compares the fuzzing figures quoted in prose against the committed
      # run reports. It belongs here, on every push, rather than after a
      # fresh fuzzing run: it is a consistency check between two committed
      # artefacts, and running it against reports a job has just overwritten
      # would compare new numbers against old prose and fail for the wrong
      # reason. It did exactly that once, which is why it moved.
      - name: The documented fuzzing figures match the reports
        run: python scripts/check_fuzz_claims.py

      # A gate that has never been observed failing is not known to work.
      # This plants one violation per gate, asserts each is rejected, and
      # asserts the matching clean control is accepted.
      # The recipe is the one file nothing else exercises until somebody
      # tries to publish, and by then the mistakes are public. This needs
      # no network and no build, so it runs with the other prose gates.
      - name: Conda recipe is consistent
        run: python scripts/check_recipe.py

      - name: Recipe gate self test
        run: python scripts/check_recipe.py --selftest

      - name: Standards gate self test
        run: python scripts/selftest_gates.py

  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync the pinned environment
        run: uv sync --group dev

      - name: Confirm the pinned compiler
        run: |
          uv run mojo --version
          uv run mojo --version | grep -q "Mojo ${MOJO_VERSION}"

      # Record the resolved target with every run. Without it, a number or a
      # failure from a host-tuned build is not comparable to anything.
      - name: Record effective target
        run: uv run mojo build --print-effective-target tests/test_toolchain.mojo

      # mojo format rewrites in place, so the gate is "format, then assert
      # nothing changed".
      - name: Formatting
        run: |
          uv run mojo format .
          git diff --exit-code

      # Vocabulary files are fetched rather than committed, so CI fetches
      # them too. The fetch script verifies each download against the ranks
      # tiktoken itself loads, so a substituted file fails here rather than
      # producing a subtly wrong tokenizer.
      - name: Fetch vocabularies
        run: uv run python scripts/fetch_vocabs.py

      - name: Generate golden fixtures
        run: |
          uv run python scripts/gen_encode_golden.py
          uv run python scripts/gen_unicode_tables.py
          uv run python scripts/gen_pretoken_golden.py
          uv run python scripts/gen_api_reference.py

      # A committed generated file that no longer matches its generator
      # means Knap is matching a pattern the reference no longer uses, which
      # would surface as mysteriously wrong tokens rather than as a failure.
      - name: Generated files are current
        run: uv run python scripts/check_generated.py

      # The docstring gate covers the library as well as the tests. Running
      # it on tests alone would leave the public API, which is the surface
      # mojo doc actually serves, unchecked.
      - name: Docstring gate
        run: |
          # Every Mojo file, not two directories of them. The narrower
          # glob missed tests/fuzz, bench and bindings entirely, and all
          # three had docstring errors in them when this was widened.
          for f in $(git ls-files '*.mojo'); do
            uv run mojo doc --Werror --diagnose-missing-doc-strings \
              -I src -I tests/fuzz -I bench -I cli -o /dev/null "$f"
          done

      - name: Build with warnings as errors
        run: |
          for f in tests/*.mojo; do
            uv run mojo build --Werror -I src -I cli -o /dev/null "$f"
          done

      # The 110 MB corpus gates are excluded here and run in corpus.yml on
      # a schedule. Together they need a download and about ten minutes,
      # which is too slow for every push. The committed fixtures cover the
      # same pattern alternatives and the same hazards in seconds.
      - name: Run the test suite
        run: |
          for f in tests/*.mojo; do
            case "$f" in
              *_corpus.mojo) echo "== skipping $f, runs in corpus.yml"; continue ;;
            esac
            echo "== $f"
            uv run mojo run -I src -I cli "$f"
          done

  scalar-and-simd:
    name: Both classifier builds agree
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync the pinned environment
        run: uv sync --group dev

      - name: Fetch vocabularies
        run: uv run python scripts/fetch_vocabs.py

      - name: Generate references
        run: |
          uv run python scripts/gen_encode_golden.py
          uv run python scripts/gen_unicode_tables.py
          uv run python scripts/gen_pretoken_golden.py
          uv run python scripts/gen_api_reference.py

      # The scalar classifier is the reference and the default. The
      # vectorised one is off by default because it measured slower, but it
      # is still compiled and tested, so it cannot rot into something that
      # no longer agrees.
      - name: Tests with the vectorised classifier
        run: |
          for f in tests/*.mojo; do
            case "$f" in
              *_corpus.mojo) continue ;;
            esac
            uv run mojo run -I src -I cli -D KNAP_SIMD=1 "$f"
          done

  python-bindings:
    name: Python bindings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync the pinned environment
        run: uv sync --group dev

      - name: Fetch vocabularies
        run: uv run python scripts/fetch_vocabs.py

      # Built here rather than shipped. The Mojo ABI is not stable, so a
      # binary artefact is only valid for the toolchain that produced it.
      - name: Build the extension
        run: uv run python bindings/python/build.py

      - name: Test the bindings against tiktoken
        run: uv run python bindings/python/tests/test_bindings.py

  mojo-package:
    name: Mojo package builds and imports
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync the pinned environment
        run: uv sync --group dev

      # Track A of the distribution milestone. A package that builds but
      # cannot be imported without the source tree is not a package.
      # The artefact is a .mojoc file. The .mojopkg extension this job used
      # to write is deprecated in Mojo 1.0.0 and warns.
      #
      # The program it runs is conda.recipe/smoke.mojo, the same one the
      # conda recipe's test section runs, rather than a copy pasted into a
      # heredoc here. Two copies of an acceptance test drift, and the copy
      # that drifts is the one nobody runs.
      - name: Precompile and import without the source tree
        run: |
          mkdir -p "${RUNNER_TEMP}/pkg"
          uv run mojo precompile src/knap -o "${RUNNER_TEMP}/pkg/knap.mojoc"
          cp conda.recipe/smoke.mojo "${RUNNER_TEMP}/smoke.mojo"
          uv run mojo run -I "${RUNNER_TEMP}/pkg" "${RUNNER_TEMP}/smoke.mojo"

  conda-package:
    name: Conda package builds from the recipe
    runs-on: ubuntu-24.04
    # Not a required check. It builds the commit named in the recipe rather
    # than the commit under test, because that is what the modular-community
    # repository will do with this file, so it is a rehearsal of publishing
    # rather than a test of the branch. A failure here means the recipe is
    # wrong, which is worth knowing before a pull request is opened against
    # somebody else's repository.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | sh
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Install rattler-build
        run: pixi global install rattler-build

      - name: Build the package
        run: |
          rattler-build build \
            --recipe conda.recipe/recipe.yaml \
            -c conda-forge \
            -c https://conda.modular.com/max \
            -c https://repo.prefix.dev/modular-community

      - name: Record what was produced
        run: |
          find output -name '*.conda' -printf '%p  %s bytes\n'

      - uses: actions/upload-artifact@v7
        with:
          name: conda-package
          path: output/**/*.conda
          if-no-files-found: error

  command-line-tool:
    name: Command line tool
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync the pinned environment
        run: uv sync --group dev

      - name: Fetch vocabularies
        run: uv run python scripts/fetch_vocabs.py

      # The parser tests run with the rest of the suite. This job exists for
      # the half a unit test cannot reach: whether the numbers are right, and
      # whether the tool survives a pipe. The first version of it encoded
      # correctly and could not be piped, because opening /dev/stdout works
      # when standard output is a file and fails when it is a pipe.
      - name: Build and check against tiktoken
        run: uv run python cli/tests/test_end_to_end.py

  unstable-api-inventory:
    name: Unstable API inventory (reporting only)
    runs-on: ubuntu-24.04
    # This job never gates a merge. Eliminating unstable API use is not
    # achievable against Mojo 1.0.0, so the goal is a visible record of
    # exposure, not a clean result. See docs/ARCHITECTURE.md.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync the pinned environment
        run: uv sync --group dev

      - name: Build the inventory
        run: |
          uv run python scripts/fetch_vocabs.py
          uv run python scripts/gen_encode_golden.py
          uv run python scripts/unstable_api_inventory.py \
            | tee "$GITHUB_STEP_SUMMARY"
