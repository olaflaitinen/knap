#
# The pre-tokenization parity gate, at full scale.
#
# This is separate from ci.yml because it is expensive: it downloads and
# assembles a 110 MB corpus, spends several minutes generating references
# with the Python reference implementation, and then compares roughly 54
# million piece boundaries and 80 million tokens. That is too slow to run on
# every push and too important to drop.
#
# The fast half of the same check runs in ci.yml against the committed
# fixtures, which cover the same pattern alternatives in a few kilobytes.

name: Corpus gate

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: corpus-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  corpus-parity:
    name: Pre-tokenization and encode parity over 110 MB
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync the pinned environment
        run: uv sync --group dev

      - name: Assemble the corpus
        run: uv run python scripts/fetch_corpus.py --target-mb 110

      - name: Generate reference boundaries
        run: uv run python scripts/gen_pretoken_golden.py

      - name: Fetch vocabularies
        run: uv run python scripts/fetch_vocabs.py

      - name: Generate encode references
        run: uv run python scripts/gen_encode_golden.py

      # The boundary parity gate, across every distinct pattern. Every
      # piece boundary the
      # scanner produces must equal the one the reference regex produces,
      # for all three patterns: 83.0 million boundaries.
      - name: Pre-tokenization parity
        run: uv run mojo run -I src tests/test_pretokenize_corpus.mojo

      # The encode parity gate, across every distinct encode behaviour.
      # Every token Knap emits must
      # equal the token tiktoken emits at the same position, across the
      # whole corpus, for each of the four distinct encode behaviours the
      # seven encodings reduce to. That is 191.8 million tokens.
      - name: Encode parity
        run: uv run mojo run -I src tests/test_encode_corpus.mojo
