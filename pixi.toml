#
# Alternate development environment for Knap, driven by pixi.
#
# pyproject.toml is the primary environment and is what CI uses. This file is
# kept working and tested because Mojo consumers are more likely to be on pixi
# than on uv, and an install path that is documented but never executed is an
# install path that is broken.
#
# The stable "max" channel is used deliberately, not "max-nightly". Knap pins
# the compiler exactly, and a nightly channel would contradict that pin.

[workspace]
name = "knap"
version = "1.0.0"
description = "A byte level BPE tokenizer written in pure Mojo, with no Python interpreter at run time."
authors = ["Olaf Yunus Laitinen Imanov <yunus.imanov@metropolia.fi>"]
license = "EUPL-1.2"
license-file = "LICENSE"
readme = "README.md"
channels = ["https://conda.modular.com/max/", "conda-forge"]
platforms = ["linux-64", "osx-arm64", "linux-aarch64"]

[dependencies]
# Pinned exactly, for the reasons given in pyproject.toml. Mojo guarantees
# source level stability only and its ABI is explicitly not stable.
mojo = "==1.0.0"
python = ">=3.10"

[pypi-dependencies]
# Reference implementations and benchmark baselines. Development only: they
# are never distributed with Knap and no Knap source derives from them. See
# THIRD_PARTY_NOTICES.md.
tiktoken = ">=0.7.0"
tokenizers = ">=0.20.0"
regex = ">=2024.0.0"

[tasks]
# These mirror the CI gates so that a contributor can run the whole standard
# locally with one command before opening a pull request.
smoke = "mojo run -I src tests/test_toolchain.mojo"
fetch = "python scripts/fetch_vocabs.py"
goldens = "python scripts/gen_encode_golden.py"
tables = "python scripts/gen_unicode_tables.py"
boundaries = "python scripts/gen_pretoken_golden.py"
generated = "python scripts/check_generated.py"
corpus = "python scripts/fetch_corpus.py"
fuzz = "python tests/fuzz/run_fuzz.py --total 1000000"
bindings = "python bindings/python/build.py"
bench = "bash bench/run_all.sh"
lint = "python scripts/lint_style.py"
banners = "python scripts/check_file_banners.py"
spdx = "python scripts/check_spdx.py"
mdcheck = "python scripts/check_md_headers.py"
selftest = "python scripts/selftest_gates.py"
standards = { depends-on = [
    "lint",
    "banners",
    "spdx",
    "mdcheck",
    "selftest",
    "generated",
] }
